stages:
  smart_filter:
    cmd: python scripts/01_filter/smart_filter.py
    deps:
      - data/raw
      - scripts/01_filter/smart_filter.py
    params:
      - filter
    outs:
      - reports/filter_flags.csv:
          cache: false
    metrics:
      - reports/filter_metrics.json:
          cache: false
  build_cleaned:
    cmd: python scripts/01_filter/build_cleaned.py
    deps:
      - data/raw
      - reports/filter_flags.csv
      - reports/review_decisions.csv
      - scripts/01_filter/build_cleaned.py
    params:
      - clean
      - filter.upper_body_categories
    outs:
      - data/cleaned
