# Hyperparameters and configuration

# Phase 1: Auto-filtering (FiftyOne)
filter:
  flag_head_crop: false
  min_image_size: 512        # min(width, height); 100 would let tiny images through
  resize_to: 512             # blur and BRISQUE are measured at this size
  blur_threshold: 100        # remove below 80, borderline 80-120 (margin 0.2)
  brisque_threshold: 50      # remove above 60, borderline 40-60
  use_brisque: true
  borderline_margin: 0.2
  pose_confidence: 0.5
  min_limbs_visible: 0.75     # below this: borderline
  min_limbs_remove: 0.6     # below this: remove
  edge_margin: 0.005
  brisque_flags: false       # record BRISQUE but don't flag with it
  seated_remove: 0.5         # thigh verticality below this = seated
  seated_borderline: 0.7
  ankle_below_frame: 1.0     # predicted ankle below the bottom edge = feet cut off
  ankle_below_frame_kurta: 1.05  # kurta-type outfits may lose the lower shin (33/42 checked fine)
  kurta_categories: [Men_Shalwar_Kameez, Men_Kurta_Set, Men_Sherwani, Women_Kurta_Set, Co-Ord-Sets]
  pose_angle_threshold: 60   # above: remove
  angle_borderline_start: 45 # 45-60: borderline (35 flagged good three-quarter shots)
  person_min_height: 0.15    # ignore people smaller than 15% of image height
  dedup_similarity: 0.95
  dedup_exact: 0.99          # at or above: duplicate whatever the colour (true copies score ~1.0)
  dedup_colour_diff: 0.06    # below dedup_exact, colour histograms must match this closely (else colour variant)
  dedup_model: facebook/dinov2-small
  upper_body_categories: [Men_Waistcoat, Jacket, Peplum, Wrap]
  yolo_model: yolo11m.pt     # in models/; yolov8n missed phones in mirror selfies
  # AI second opinion (SigLIP zero-shot). Disagreement with the rules -> borderline.
  use_ai_check: false        # tested base + so400m on 304 images: no gain over rules
  ai_model: google/siglip2-base-patch16-384
  ai_keep_conf: 0.6          # rules borderline + AI 'good' >= this -> keep
  ai_remove_conf: 0.6        # rules borderline + AI bad label >= this -> remove
  # borderline images settled without review (checked by eye on run rules-v1)
  auto_keep_reasons: [slightly_turned, soft]   # ~95% fine
  auto_remove_reasons: [maybe_seated]          # ~85% seated

# Phase 3: Preprocessing
preprocess:
  mediapipe_confidence: 0.5
  densepose_model: "r50"       # r50 or r101
  sam_model_type: "vit_l"      # vit_h, vit_l, vit_b
  sam_checkpoint: "sam_vit_l_0b3195"

# Phase 4: Training
train:
  model_id: "stabilityai/stable-diffusion-xl-base-1.0"
  learning_rate: 1.0e-5
  batch_size: 8
  num_epochs: 10
  lora_rank: 8
  lora_alpha: 16
  save_every_n_steps: 500
  validation_every_n_steps: 1000

# API
api:
  inference_timeout: 10        # seconds
  max_file_size: 10            # MB
